name: Build APK e Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/**']

env:
  API_URL: https://petvida-api.onrender.com/api

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas android e web
        working-directory: app
        run: flutter create --platforms=android,web --org com.petvida --project-name petvida .

      - name: Ajustar permissões e notificações do Android
        run: python3 .github/scripts/patch_android.py app/android

      - name: Baixar dependências
        working-directory: app
        run: flutter pub get

      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release --dart-define=API_URL=$API_URL

      - name: Compilar site (web)
        working-directory: app
        run: flutter build web --release --dart-define=API_URL=$API_URL

      - uses: actions/upload-artifact@v4
        with:
          name: petvida-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar site na branch web-dist
        run: |
          cd app/build/web
          git init -q -b web-dist
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Build web"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-dist
