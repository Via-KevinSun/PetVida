name: Build APK

on:
  workflow_dispatch:        # botão "Run workflow" no GitHub
  push:
    branches: [main]
    paths: ['app/**', '.github/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta android
        working-directory: app
        run: flutter create --platforms=android --org com.petvida --project-name petvida .

      - name: Ajustar permissões e notificações do Android
        run: python3 .github/scripts/patch_android.py app/android

      - name: Baixar dependências
        working-directory: app
        run: flutter pub get

      - name: Compilar APK
        working-directory: app
        # >>> TROQUE pelo endereço do seu servidor no Render (termina em /api) <<<
        run: flutter build apk --release --dart-define=API_URL=https://SEU-SERVIDOR.onrender.com/api

      - uses: actions/upload-artifact@v4
        with:
          name: petvida-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
